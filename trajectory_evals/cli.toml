[cli]  # the program name usage and error lines print
prog = "python -m trajectory_evals"

[defaults]  # what a command uses when its option is not given; the code fills in each {placeholder}
max_concurrency = 4
results_dir = "results"
host = "127.0.0.1"
port = 9999
serve_url = "http://{host}:{port}/"
experiment_prefix = "{agent}-{command}"
dataset_name = "{prefix}/{source}"
ping_message = "Hello"
persona_separator = ","
run_limit = 100
harvest_file = "{agent}-{stamp}.jsonl"
stamp_format = "%Y%m%d_%H%M%S"

[segments]  # summary pass_rate[<key>=<value>] lines a command reports, read from row metadata, outputs or inputs
eval = ["risk", "difficulty"]
simulate = ["persona"]
redteam = ["persona"]

[check]  # where check looks for datasets, and which file names hold scenarios
datasets_dir = "datasets"
datasets_glob = "*.jsonl"
scenario_marker = "scenario"

[metadata_keys]  # the experiment metadata and meta.json key each run fact is recorded under
agent = "agent"
command = "command"
data = "dataset_file"
history = "history"
experiment = "experiment"
dataset = "dataset"
url = "url"
options = "options"

[help]  # argparse help text: argparse fills in %(default)s
description = "Evaluate, simulate, red-team and optimize an agent reached over A2A."
check = "validate an agent folder, its datasets and its card"
serve = "serve a [bridge] agent over HTTP as an A2A agent"
eval = "score the agent on golden JSONL cases"
simulate = "run simulated conversations from scenario JSONL"
redteam = "attack the agent with red-team personas and report the attack success rate"
optimize = "hill-climb the [optimize] prompts with a reflection model; nothing is applied"
sweep = "pick the cheapest [variants] prompt set that clears the [optimize] floors"
langsmith = "pull, push, harvest and score with LangSmith"
pull = "write a LangSmith dataset as golden JSONL under data/"
push = "mirror a golden JSONL file into a LangSmith dataset"
harvest = "write production runs as golden-case candidates under data/langsmith/"
score = "score production runs with the reference-free judges and write feedback"
agent = "a folder name under agents/, or a path to an agent folder"
ping = "also send one real message; costs an LLM call"
host = "address to bind; the bridge has no inbound auth (default: %(default)s)"
port = "port to bind (default: %(default)s)"
url = "the URL the agent card advertises (default: http://<host>:<port>/); set it when binding 0.0.0.0 or ::"
data = "golden JSONL file"
scenarios = "scenario JSONL file"
local = "run offline: no dataset sync, upload or tracing; results are not shared evidence"
limit = "run only the first N cases"
repetitions = "times each case runs (default: %(default)s)"
concurrency = "cases run at once (default: %(default)s)"
prefix = "experiment name prefix (default: <agent>-<command>)"
results_dir = "where results/<run_id>/ is written (default: %(default)s)"
criteria_model = "provider:model of the expected.criteria judge (default: the golden judge model)"
max_turns = "user messages per conversation (default: the case's, else [simulation] max_turns)"
personas = "comma-separated attack personas (default: [redteam] personas, else every attack persona)"
attempts = "conversations per persona (default: [redteam] attempts)"
upload_as_experiments = "upload every candidate's experiments to LangSmith"
include = "also sweep a folder of <name>.md prompts, such as an optimize run's best/"
dataset = "LangSmith dataset name"
pull_out = "new JSONL file under data/ to write"
push_dataset = "dataset name (default: <[langsmith] dataset_prefix or agent>/<file stem>)"
harvest_out = "new JSONL file under data/ to write (default: data/langsmith/<agent>-<time>.jsonl)"
project = "LangSmith project to read runs from (default: [langsmith] project)"
since_days = "read runs started this many days ago or later (default: [langsmith] since_days)"
run_limit = "read at most N root runs (default: %(default)s)"
filter = "a LangSmith run filter, such as eq(name, \"sales\")"
only_errors = "harvest only runs that errored"
feedback_key = "harvest only runs with this feedback key"
feedback_below = "with --feedback-key, only runs it scored below X"
dry_run = "log each score instead of writing feedback"

[help.metavars]  # what argparse shows in place of an option's value
command = "COMMAND"
agent = "AGENT"
count = "N"
path = "FILE"
directory = "DIR"
prefix = "PREFIX"
model = "MODEL"
names = "NAMES"
host = "HOST"
port = "PORT"
url = "URL"
dataset = "NAME"
project = "PROJECT"
filter = "FILTER"
key = "KEY"
score = "X"

[texts]  # the CLI's own output and its errors: the code fills in each {placeholder}
error_line = "{prog}: error: {error}"
no_langsmith_key = "{env} is not set; export it, or pass --local to keep results offline"
data_not_found = "data file not found: {path}"
folder_not_found = "folder not found: {path}"
no_rows = "no cases to run in {path}"
not_positive_int = "expected a whole number >= 1, got {text!r}"
bad_model = "model {name!r} is not a provider:model string"
model_failed = "cannot build model {name!r}: {error}"
agent_failed = "cannot start agent {name!r}: {error}"
no_policy = "redteam needs a [redteam] policy in agent.toml: the file saying what the agent must never do"
unknown_personas = "{path}: scenarios use unknown personas {names}; choose from {known}"
no_project = "no LangSmith project: pass --project or set [langsmith] project in agent.toml"
open_bind = "warning: binding {host}, which is not a loopback address; the bridge has no inbound auth, so anyone who can reach it can talk to the agent"
needs_url = "warning: the card advertises {url}, which remote clients cannot reach; pass --url with the address they use"
low_coverage = "WARNING: {key}_coverage is {coverage:.4f}, below 1: some attacks were never judged (judge or agent errors), so the attack success rate is uncertain; read rows.jsonl before trusting it"
asr_line = "defended rate (pass_rate; an attack whose agent call failed counts as not defended): {defended}; attack success rate (attack_succeeded over judged attacks): {asr}; attack_succeeded_coverage: {coverage}; error_rate: {error_rate}"
results_line = "results: {path}"
agent_line = "agent: {name} ({root})"
tables_line = "tables: ok"
dataset_line = "{path}: {count} cases"
card_line = "card: ok"
ping_line = "ping: {text}"
optimize_line = "verdict: {verdict} ({reason}); best: {best}; stopped: {stop}"
sweep_line = "verdict: {verdict} ({reason}); winner: {winner}"
variant_line = "{id}: cost {cost}, val pass_rate {pass_rate}, {verdict} ({reason})"
no_reason = "-"
wrote_line = "wrote {path}"
pushed_line = "pushed {path} to dataset {name}"
runs_line = "runs read: {runs}"
key_line = "{key}: scored {scored}, skipped {skipped}, errors {errors}, written {written}"
