[cli]  # bad input exits with input_error_exit_code; changing dataset_namespace gives every uploaded example a new id
prog = "python -m trajectory_evals"
input_error_exit_code = 2
langsmith_api_key_env = "LANGSMITH_API_KEY"
dataset_namespace = "trajectory-evals"

[defaults]  # what a command uses when its option is not given; the code fills in each {placeholder}
max_concurrency = 4
results_dir = "results"
host = "127.0.0.1"
port = 9999
serve_url = "http://{host}:{port}/"
experiment_prefix = "{agent}-{command}"
dataset_name = "{prefix}/{source}"
ping_message = "Hello"
persona_separator = ","

[segments]  # summary pass_rate[<key>=<value>] lines each command reports, read from row metadata or outputs
eval = ["risk", "difficulty"]
simulate = ["persona"]
redteam = ["persona"]

[check]  # where check looks for datasets, and which file names hold scenarios
datasets_dir = "datasets"
datasets_glob = "*.jsonl"
scenario_marker = "scenario"

[metadata_keys]  # the experiment metadata and meta.json key each run fact is recorded under
agent = "agent"
command = "command"
data = "dataset_file"
history = "history"
experiment = "experiment"
dataset = "dataset"
url = "url"

[help]  # argparse help text: argparse fills in %(default)s
description = "Evaluate, simulate and red-team an agent reached over A2A."
check = "validate an agent folder, its datasets and its card"
serve = "serve a [bridge] agent over HTTP as an A2A agent"
eval = "score the agent on golden JSONL cases"
simulate = "run simulated conversations from scenario JSONL"
redteam = "attack the agent with red-team personas; pass_rate is the attack success rate, lower is better"
agent = "a folder name under agents/, or a path to an agent folder"
ping = "also send one real message; costs an LLM call"
host = "address to bind; the bridge has no inbound auth (default: %(default)s)"
port = "port to bind (default: %(default)s)"
data = "golden JSONL file"
scenarios = "scenario JSONL file"
local = "run offline: no dataset sync, upload or tracing; results are not shared evidence"
limit = "run only the first N cases"
repetitions = "times each case runs (default: %(default)s)"
concurrency = "cases run at once (default: %(default)s)"
prefix = "experiment name prefix (default: <agent>-<command>)"
results_dir = "where results/<run_id>/ is written (default: %(default)s)"
criteria_model = "provider:model of the expected.criteria judge (default: the golden judge model)"
max_turns = "user messages per conversation (default: the case's, else [simulation] max_turns)"
personas = "comma-separated attack personas (default: [redteam] personas, else every attack persona)"
attempts = "conversations per persona (default: [redteam] attempts)"

[help.metavars]  # what argparse shows in place of an option's value
command = "COMMAND"
agent = "AGENT"
count = "N"
path = "FILE"
directory = "DIR"
prefix = "PREFIX"
model = "MODEL"
names = "NAMES"
host = "HOST"
port = "PORT"

[texts]  # the CLI's own output and its errors: the code fills in each {placeholder}
error_line = "{prog}: error: {error}"
no_langsmith_key = "{env} is not set; export it, or pass --local to keep results offline"
data_not_found = "data file not found: {path}"
no_rows = "no cases to run in {path}"
not_positive_int = "expected a whole number >= 1, got {text!r}"
bad_model = "model {name!r} is not a provider:model string"
open_bind = "warning: binding {host}, which is not a loopback address; the bridge has no inbound auth, so anyone who can reach it can talk to the agent"
low_coverage = "WARNING: {key}_coverage is {coverage:.4f}, below 1: some attacks were never judged (judge or agent errors), so the attack success rate is uncertain; read rows.jsonl before trusting it"
results_line = "results: {path}"
agent_line = "agent: {name} ({root})"
tables_line = "tables: ok"
dataset_line = "{path}: {count} cases"
card_line = "card: ok"
ping_line = "ping: {text}"
