[evaluators]  # LangSmith's aevaluate hands evaluators {errored_output_key: None} for a target that raised
errored_output_key = "output"

[texts]  # messages for a bad data row or agent folder: the code fills in each {placeholder}
not_found = "file not found: {path}"
file_error = "{path}: {message}"
no_endpoint = "{path}: [agent] needs a url, or the file needs a [bridge] table"
outside_root = "{path} is outside the agent folder {root}"
not_an_object = "row is not a JSON object"
duplicate_case_id = "case_id {case_id!r} appears more than once"
line_error = "{path}:{line}: {message}"
field_error = "{location}: {reason}"
field_error_separator = "; "
location_separator = "."
row_location = "row"
at_least_one = "{name} must be at least 1, got {value}"
