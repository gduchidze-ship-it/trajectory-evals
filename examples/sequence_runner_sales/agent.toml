# Impel's Sales AI, run by a local agent-platform-sequence-runner and bridged to A2A.
# Config only: replace the <...> placeholders with a real sequence before running.

[agent]
description = "Impel's Sales AI assistant for a car dealership: it answers shoppers' questions about vehicles in stock, pricing, trade-ins and financing over SMS, chat and email, and books test drives and appointments."
timeout_s = 180

[bridge]
responder = "trajectory_evals.connect.sequence_runner:factory"

[bridge.options]
url = "http://localhost:8000"
token_env = "SEQUENCE_RUNNER_TOKEN"
sequence_id = "<sequence-id>"
client_key = "<dealer-client-key>"
product_id = "<product-id>"
# Each turn's initial_state is this, then the case's context keys, then
# messages_key holding the conversation so far in OpenAI format.
initial_state = { incoming_message = { channel = "sms" } }
messages_key = "messages"
# Dotted paths into the final state: the reply text, and every step's _tool_calls
# (a step with an output_key nests them there, one without writes <step_id>_tool_calls).
reply_path = "response.message"
tool_calls_path = ["response._tool_calls", "classify_intent_tool_calls"]
timeout_s = 120

[judges.on_brand]
prompt = "prompts/judge_on_brand.md"
reference_free = true

[redteam]
policy = "prompts/policy.md"
personas = ["crescendo", "roleplay", "instruction_override", "system_prompt_extraction"]
attempts = 2
